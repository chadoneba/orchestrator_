{% extends "base.html" %}
{% block title %}Внешняя очередь{% endblock %}
{% block content %}
<h2 style="margin-bottom:15px;">Внешняя очередь (Run Service)</h2>

<!-- ВОРКЕР -->
<div style="background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:12px;margin-bottom:15px;">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <span style="font-weight:600;">⚙️ Воркер:</span>
        <span id="worker-status" style="color:#888;">⏳ загружаю…</span>
        <button type="button" id="btn-pause" style="background:#f57f17;">⏸ Пауза</button>
        <button type="button" id="btn-resume" style="background:#2e7d32;">▶ Продолжить</button>
        <button type="button" id="btn-refresh" style="background:#555;">🔄 Обновить</button>
    </div>
</div>

<!-- ОШИБКА -->
<div id="error-box" style="display:none;background:#ffebee;color:#c62828;
            border:1px solid #ef9a9a;border-radius:8px;padding:10px;margin-bottom:15px;">
</div>

<!-- ОЧЕРЕДЬ -->
<div id="queue-groups">
    <div style="text-align:center;color:#999;padding:20px;">⏳ Загружаю очередь…</div>
</div>

<!-- ИСТОРИЯ -->
<div style="background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:12px;margin-top:15px;">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;">
        <span style="font-weight:600;">🗂 История</span>
        <span id="history-msg" style="font-size:11px;color:#888;"></span>
        <span style="flex:1;"></span>
        <input type="datetime-local" id="history-before" style="font-size:12px;">
        <button type="button" id="btn-history-clear"
                style="background:#c62828;font-size:11px;padding:4px 10px;">
            🗑 Очистить до даты
        </button>
    </div>
    <table>
        <thead>
            <tr>
                <th>UID</th>
                <th>Группа</th>
                <th>Тип</th>
                <th>Статус</th>
                <th>Ошибка</th>
                <th>Длит.</th>
                <th>Общая</th>
            </tr>
        </thead>
        <tbody id="history-body">
            <tr><td colspan="7" style="text-align:center;color:#999;padding:20px;">⏳ Загружаю историю…</td></tr>
        </tbody>
    </table>
</div>

<script>

var QUEUE_URL = "/run/api/queue";
var WORKER_URL = "/run/api/worker/status";

var progressCache = {};

// --- Раскраска статусов ---
var statusColor = {
    pending: "#ffb74d",
    running: "#42a5f5",
    done: "#66bb6a",
    completed: "#66bb6a",
    failed: "#ef5350",
    cancelled: "#9e9e9e"
};

function showError(msg) {
    var box = document.getElementById("error-box");
    if (!msg) { box.style.display = "none"; return; }
    box.style.display = "block";
    box.textContent = "❌ " + msg;
}

// --- Формат mm:ss ---
function fmtDuration(seconds) {
    if (seconds == null || isNaN(seconds)) return "—";
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

// --- Воркер ---
function renderWorker(data) {
    var el = document.getElementById("worker-status");
    if (data.error) {
        el.textContent = "недоступен: " + data.error;
        el.style.color = "#c62828";
        return;
    }
    var state = data.paused ? "⏸ приостановлен" : "▶ работает";
    var cur = data.current_task_uid != null ? ", задача #" + data.current_task_uid : "";
    el.textContent = state + cur;
    el.style.color = data.paused ? "#f57f17" : "#2e7d32";
}

// --- Очередь (группы + этапы) ---
function renderQueue(items) {
    var container = document.getElementById("queue-groups");
    showError(null);

    if (!Array.isArray(items)) {
        showError(items && items.error ? items.error : "Некорректный ответ /queue");
        return;
    }

    if (items.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">Очередь пуста</div>';
        return;
    }

    // Группируем по group_id
    var groups = {};
    items.forEach(function(item) {
        var gid = item.group_id;
        if (!groups[gid]) groups[gid] = [];
        groups[gid].push(item);
    });

    // Сортируем группы по минимальной position
    var groupIds = Object.keys(groups).map(Number);
    groupIds.sort(function(a, b) {
        var minA = Math.min.apply(null, groups[a].map(function(it) { return it.position; }));
        var minB = Math.min.apply(null, groups[b].map(function(it) { return it.position; }));
        return minA - minB;
    });

    var html = "";

    groupIds.forEach(function(gid) {
        var tasks = groups[gid];
        tasks.sort(function(a, b) { return a.position - b.position; });

        html += '<div style="background:#fff;border:1px solid #e0e0e0;' +
                'border-radius:8px;padding:0;margin-bottom:12px;overflow:hidden;">';

        // Заголовок группы
        html += '<div style="background:#f5f5f5;padding:8px 12px;' +
                'border-bottom:1px solid #e0e0e0;font-weight:600;' +
                'font-size:13px;display:flex;justify-content:space-between;">' +
                '<span>📦 Группа #' + gid + '</span>' +
                '<span style="font-weight:400;color:#888;">' + tasks.length + ' задач(а)</span>' +
                '</div>';

        // Таблица задач
        html += '<table style="width:100%;margin:0;">' +
                '<thead><tr>' +
                '<th style="width:130px;">UID</th>' +
                '<th>Тип</th>' +
                '<th>Статус</th>' +
                '<th style="width:50px;">Поз.</th>' +
                '<th style="width:200px;">Этапы / Прогресс</th>' +
                '<th style="width:50px;"></th>' +
                '</tr></thead>' +
                '<tbody>';

        tasks.forEach(function(task) {
            var uid = task.task_uid != null ? task.task_uid : "—";
            var color = statusColor[task.status] || "#888";

            // Основная строка задачи
            html += '<tr>' +
                '<td style="font-family:monospace;font-size:12px;">' + uid + '</td>' +
                '<td>' + task.task_type + '</td>' +
                '<td style="color:' + color + ';">' + task.status + '</td>' +
                '<td style="text-align:center;">' + task.position + '</td>' +
                '<td style="vertical-align:top;">' +
                '<div id="task-steps-' + uid + '" style="font-size:12px;color:#888;min-height:48px;">…</div>' +
                '</td>' +
                '<td><button type="button" class="cancel-btn" data-uid="' + uid + '" ' +
                    'style="font-size:11px;padding:4px 8px;background:#c62828;color:#fff;' +
                    'border:none;border-radius:3px;cursor:pointer;">✕</button></td>' +
                '</tr>';
        });

        html += '</tbody></table></div>';
    });

    container.innerHTML = html;

    // Привязка кнопок отмены
    document.querySelectorAll(".cancel-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
            var uid = btn.getAttribute("data-uid");
            if (!confirm("Отменить задачу #" + uid + "?")) return;
            btn.disabled = true;
            btn.textContent = "⏳";
            fetch("/run/api/task/" + encodeURIComponent(uid) + "/cancel", { method: "POST" })
                .then(function(r) { return r.json(); })
                .then(function() { poll(); })
                .catch(function(err) { alert("❌ " + err); poll(); });
        });
    });
}

// --- Загрузка прогресса и отрисовка этапов ---
function loadProgress(items) {
    items.forEach(function(item) {
        var uid = item.task_uid;
        if (uid == null) return;

        fetch("/run/api/task/" + encodeURIComponent(uid) + "/progress")
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) return;
                progressCache[uid] = data;
                renderSteps(uid, data);
            })
            .catch(function() {});
    });
}

function renderSteps(uid, progress) {
    var cell = document.getElementById("task-steps-" + uid);
    if (!cell) return;

    var steps = progress.steps;
    if (!Array.isArray(steps) || steps.length === 0) {
        // Нет этапов — показываем общий прогресс
        if (progress.percent != null) {
            cell.textContent = Math.round(progress.percent) + "%";
        } else if (progress.error) {
            cell.textContent = "⚠ " + progress.error;
            cell.style.color = "#c62828";
        } else {
            cell.textContent = progress.status || "…";
        }
        return;
    }

    var html = "";
    steps.forEach(function(step) {
        var icon = "";
        var lineColor = "#888";

        if (step.status === "running") {
            icon = "▶ ";
            lineColor = "#42a5f5";
        } else if (step.status === "done" || step.status === "completed") {
            icon = "✓ ";
            lineColor = "#66bb6a";
        } else if (step.status === "failed") {
            icon = "✗ ";
            lineColor = "#ef5350";
            if (step.error) {
                icon += step.error + " ";
            }
        } else {
            icon = "○ ";
        }

        // --- Новое: progress — строка, определяем по суффиксу % ---
        var detail = "";
        var raw = step.progress;
        if (raw != null && typeof raw === "string") {
            if (raw.endsWith("%")) {
                detail = raw;
            } else {
                var secs = parseFloat(raw);
                if (!isNaN(secs)) {
                    detail = fmtDuration(secs);
                } else {
                    detail = raw;
                }
            }
        } else {
            detail = "—";
        }

        html += '<div style="color:' + lineColor + ';white-space:nowrap;">' +
                icon + step.short_type + ' <span style="font-family:monospace;">' + detail + '</span>' +
                '</div>';
    });

    cell.innerHTML = html;
}

// --- История ---
function renderHistory(items) {
    var body = document.getElementById("history-body");
    var msgEl = document.getElementById("history-msg");

    if (!Array.isArray(items)) {
        msgEl.textContent = "ошибка: " + (items && items.error ? items.error : "некорректный ответ");
        msgEl.style.color = "#c62828";
        return;
    }
    msgEl.textContent = "Всего: " + items.length;
    msgEl.style.color = "#888";

    if (items.length === 0) {
        body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:20px;">История пуста</td></tr>';
        return;
    }

    var sorted = items.slice().sort(function(a, b) {
        return (b.group_id || 0) - (a.group_id || 0);
    });

    var html = "";
    sorted.forEach(function(item) {
        var color = statusColor[item.status] || "#888";

        html += '<tr>' +
            '<td>' + (item.task_uid != null ? item.task_uid : "—") + '</td>' +
            '<td>#' + item.group_id + '</td>' +
            '<td>' + item.task_type + '</td>' +
            '<td style="color:' + color + ';">' + item.status + '</td>' +
            '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c62828;" title="' + (item.error || "") + '">' + (item.error || "—") + '</td>' +
            '<td style="font-family:monospace;">' + fmtDuration(item.duration_seconds) + '</td>' +
            '<td style="font-family:monospace;">' + fmtDuration(item.total_duration) + '</td>' +
            '</tr>';
    });
    body.innerHTML = html;
}

function loadHistory() {
    fetch("/run/api/history")
        .then(function(r) { return r.json(); })
        .then(renderHistory)
        .catch(function(err) {
            var msgEl = document.getElementById("history-msg");
            msgEl.textContent = err;
            msgEl.style.color = "#c62828";
        });
}

// Очистка истории
document.getElementById("btn-history-clear").addEventListener("click", function() {
    var isoLocal = document.getElementById("history-before").value;
    if (!isoLocal) {
        alert("Укажи дату (datetime-local)");
        return;
    }
    var iso = isoLocal + ":00";
    if (!confirm("Очистить историю до " + iso + "?")) return;

    fetch("/run/api/history/clear", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ before: iso })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.error) { alert("❌ " + data.error); }
        loadHistory();
    })
    .catch(function(err) { alert("❌ " + err); });
});

// --- Опрос ---
function poll() {
    fetch(WORKER_URL)
        .then(function(r) { return r.json(); })
        .then(renderWorker)
        .catch(function() { renderWorker({ error: "нет соединения" }); });

    fetch(QUEUE_URL)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) { showError(data.error); return; }
            renderQueue(data);
            loadProgress(data);
        })
        .catch(function(err) { showError(err); });

    loadHistory();
}

// Кнопки воркера
document.getElementById("btn-pause").addEventListener("click", function() {
    fetch("/run/api/worker/pause", { method: "POST" })
        .then(function(r) { return r.json(); })
        .then(function() { poll(); })
        .catch(function(err) { showError(err); });
});
document.getElementById("btn-resume").addEventListener("click", function() {
    fetch("/run/api/worker/resume", { method: "POST" })
        .then(function(r) { return r.json(); })
        .then(function() { poll(); })
        .catch(function(err) { showError(err); });
});
document.getElementById("btn-refresh").addEventListener("click", poll);

// Старт
poll();
setInterval(poll, 2000);

</script>
{% endblock %}
